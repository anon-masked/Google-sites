<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Main</title>

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="main.css">

    <!-- NAVBAR CSS -->
    <link rel="stylesheet" href="navbar/navbar.css">

</head>

<body>

    <!-- =========================
         NAVIGATION BAR
         ========================= -->

    <nav class="navbar">

<button class="logo-button" id="logoButton">
    <span class="logo-stage">

        <img
            id="logoImage1"
            class="logo-image logo-active"
            src="/images/mtf.png"
            alt="MTF Logo"
        >

        <img
            id="logoImage2"
            class="logo-image"
            src="/images/rrh.png"
            alt="RRH Logo"
        >

    </span>
</button>

        <div class="nav-links">

            <a href="index.html">HOME</a>

            <a href="#">DATABASE</a>

            <a href="archives.html">ARCHIVES</a>

            <a href="#">PERSONNEL</a>

        </div>

<div class="help-container">

    <button class="help-button" id="helpButton">
        HELP
    </button>

    <div class="help-dropdown" id="helpDropdown">

        <div class="audio-title">
            AUDIO CONTROL
        </div>

        <div class="audio-controls">

            <button id="musicToggle" class="music-toggle">
                ▶
            </button>

            <span id="musicStatus">
                MUSIC
            </span>

        </div>

        <div class="volume-container">

            <span class="volume-label">VOL</span>

            <input
                type="range"
                id="volumeSlider"
                min="0"
                max="1"
                step="0.01"
                value="0.35"
            >

        </div>

    </div>

</div>

<audio
    id="backgroundMusic"
    src="/Sound effects/scp main ambience.mp3"
    loop
></audio>

    </nav>


    <!-- =========================
         BINARY CORNERS
         ========================= -->

    <div class="binary binary-top-right"></div>

    <div class="binary binary-bottom-left"></div>

         ========================= -->

        <!-- Your main page content goes here -->

    </main>

</body>

</html>
