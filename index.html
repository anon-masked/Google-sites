<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Main</title>

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="main.css">

    <!-- NAVBAR CSS -->
    <link rel="stylesheet" href="navbar/navbar.css">

    <!-- INTRO CSS -->
    <link rel="stylesheet" href="intro/intro.css">

</head>

<body>

    <!-- =========================
         NAVIGATION BAR
         ========================= -->

    <nav class="navbar">

        <button class="logo-button" id="logoButton">

            <span class="logo-stage">

                <img
                    id="logoImage1"
                    class="logo-image logo-active"
                    src="images/mtf.png"
                    alt="MTF Logo"
                >

                <img
                    id="logoImage2"
                    class="logo-image"
                    src="images/rrh.png"
                    alt="RRH Logo"
                >

            </span>

        </button>


<div class="nav-links">

    <a href="#" data-page="home">HOME</a>

    <a href="#" data-page="database">DATABASE</a>

    <a href="#" data-page="archives">ARCHIVES</a>

    <a href="#" data-page="personnel">PERSONNEL</a>

    <a href="#" data-page="diary">DIARY ENTRIES</a>

</div>


        <div class="help-container">

            <button class="help-button" id="helpButton">
                HELP
            </button>


            <div class="help-dropdown" id="helpDropdown">

                <div class="audio-title">
                    AUDIO CONTROL
                </div>


                <div class="audio-controls">

                    <button
                        id="musicToggle"
                        class="music-toggle"
                    >
                        ▶
                    </button>

                    <span id="musicStatus">
                        MUSIC
                    </span>

                </div>


                <div class="volume-container">

                    <span class="volume-label">
                        VOL
                    </span>

                    <input
                        type="range"
                        id="volumeSlider"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.35"
                    >

                </div>

                <div class="intro-control">

    <div class="audio-title">
        INTRO PROTOCOL
    </div>

    <button id="refreshIntroButton" class="refresh-intro-button">
        REPLAY INTRO
    </button>

</div>


                
            </div>

        </div>

    </nav>


    <!-- =========================
         BACKGROUND AUDIO
         ========================= -->

    <audio
        id="backgroundMusic"
        src="Sound effects/scp main ambience.mp3"
        loop
    ></audio>


    <!-- =========================
         BINARY CORNERS
         ========================= -->

    <div class="binary binary-top-right"></div>

    <div class="binary binary-bottom-left"></div>


    <!-- =========================
         MAIN PAGE CONTENT
         ========================= -->

    <main class="page-content">

    <!-- =========================
         HOME
         ========================= -->

    <section id="home" class="site-page active">

        <h1>HOME</h1>

        <p>
            HOME PAGE ACTIVE
        </p>

    </section>


    <!-- =========================
         DATABASE
         ========================= -->

    <section id="database" class="site-page">

        <h1>DATABASE</h1>

        <p>
            DATABASE PAGE ACTIVE
        </p>

    </section>


    <!-- =========================
         ARCHIVES
         ========================= -->

    <section id="archives" class="site-page">

        <h1>ARCHIVES</h1>

        <p>
            ARCHIVES PAGE ACTIVE
        </p>

    </section>


    <!-- =========================
         PERSONNEL
         ========================= -->

    <section id="personnel" class="site-page">

        <h1>PERSONNEL</h1>

        <p>
            PERSONNEL PAGE ACTIVE
        </p>

    </section>


    <!-- =========================
         DIARY
         ========================= -->

    <section id="diary" class="site-page">

        <h1>DIARY ENTRIES</h1>

        <p>
            DIARY PAGE ACTIVE
        </p>

    </section>

</main>


    <!-- =========================
         PAGE JS
         ========================= -->

    <script src="main.js"></script>


    <!-- =========================
         NAVBAR JS
         ========================= -->

    <script src="navbar/navbar.js"></script>

    <!-- =========================
         INTRO JS
         ========================= -->
    
    <script src="intro/intro.js"></script>


    
</body>

</html>
