                id="helpButton"
            >
                HELP
            </button>


            <div
                class="help-dropdown"
                id="helpDropdown"
            >

                <div class="audio-title">
                    AUDIO CONTROL
                </div>


                <div class="audio-controls">

                    <button
                        id="musicToggle"
                        class="music-toggle"
                    >
                        ▶
                    </button>


                    <span id="musicStatus">
                        MUSIC
                    </span>

                </div>


                <div class="volume-container">

                    <span class="volume-label">
                        VOL
                    </span>


                    <input
                        type="range"
                        id="volumeSlider"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.35"
                    >

                </div>

            </div>

        </div>

    </nav>
